server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: agroalerta-api
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    # Orígenes permitidos, separados por coma (Vite puede ocupar 5173/5174/5175)
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:5174,http://localhost:5175}

# Conexión a Supabase por API REST (PostgREST en /rest/v1).
# La clave secreta se usa solo en el servidor; nunca va al frontend.
supabase:
  url: ${SUPABASE_URL}
  publishable-key: ${SUPABASE_PUBLISHABLE_KEY}
  secret-key: ${SUPABASE_SECRET_KEY:}
